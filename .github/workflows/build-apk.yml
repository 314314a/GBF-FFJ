name: Build Android APK (藍箱記錄)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 1. Checkout Repository (Pure Git)
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -f FETCH_HEAD

      - name: 2. Auto-Unzip & Prepare Web Assets
        run: |
          if [ ! -f "index.html" ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE"
            fi
          fi
          rm -rf www android
          mkdir -p www
          if [ -f "index.html" ]; then
            cp -f index.html www/index.html
          fi
          for f in manifest.json sw.js icon-192.png icon-512.png icon.png; do
            [ -f "$f" ] && cp -f "$f" www/ || true
          done

      - name: 3. Initialize Capacitor Android Project
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          echo '{"name":"blue-chest-tracker","version":"1.0.0","private":true,"dependencies":{"@capacitor/android":"6.1.2","@capacitor/cli":"6.1.2","@capacitor/core":"6.1.2"}}' > package.json
          echo '{"appId":"com.gbf.bluechest.tracker","appName":"藍箱記錄","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          npm install --no-audit --no-fund --fetch-timeout=60000
          npx cap telemetry off || true
          npx cap add android
          npx cap sync android

      - name: 4. Overwrite Android Icons with Blue Chest & Configure Permissions
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 -c "
          from PIL import Image
          import os
          src_p = 'icon-512.png' if os.path.exists('icon-512.png') else ('icon-192.png' if os.path.exists('icon-192.png') else 'icon.png')
          if os.path.exists(src_p):
              img = Image.open(src_p).convert('RGBA')
              densities = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in densities.items():
                  target_dir = os.path.join('android', 'app', 'src', 'main', 'res', folder)
                  if os.path.exists(target_dir):
                      resized = img.resize((size, size), Image.Resampling.LANCZOS)
                      for target_name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                          resized.save(os.path.join(target_dir, target_name), format='PNG')
                      print('Updated Android launcher icon for:', folder, size)
          " || true
          sed -i 's/networkTimeout=10000/networkTimeout=60000/g' android/gradle/wrapper/gradle-wrapper.properties || true
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><application|' android/app/src/main/AndroidManifest.xml || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 5. Save APK to Repository & Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            cp -f "$APK_PATH" ./blue-chest-tracker.apk
            cp -f "$APK_PATH" ./藍箱記錄.apk
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f blue-chest-tracker.apk 藍箱記錄.apk
            git commit -m "Auto-build 藍箱記錄 Android APK [skip ci]" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
            gh release create "v1.0.${GITHUB_RUN_NUMBER}" ./藍箱記錄.apk --title "藍箱記錄 APK v1.0.${GITHUB_RUN_NUMBER}" --notes "點擊下方 藍箱記錄.apk 即可直接下載到 Android 手機安裝並離線使用。" || true
          fi
